name: Update CV from Google Scholar

# Scheduled workflows only fire from the default branch — this is inert until merged.
# Runs roughly every 10 days (Google Scholar has no official API; scraping less
# frequently keeps this well within reasonable/polite bounds). Use "Run workflow"
# in the Actions tab to trigger it on demand (e.g. right after a new paper is out).
on:
  schedule:
    - cron: '0 7 1,11,21 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-cv
  cancel-in-progress: false

jobs:
  update-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scholarly
        run: pip install -r scripts/requirements.txt

      - name: Refresh citation stats + publication list from Google Scholar
        run: python scripts/update_cv.py

      - name: Compile CV to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: aadesh-salecha-cv.tex
          working_directory: cv

      - name: Publish compiled PDF into data/
        run: |
          mkdir -p data
          mv cv/aadesh-salecha-cv.pdf data/AadeshSalecha-CV.pdf

      - name: Commit if changed
        run: |
          git config user.name "cv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cv/aadesh-salecha-cv.tex data/AadeshSalecha-CV.pdf
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Auto-update CV from Google Scholar"
          git push

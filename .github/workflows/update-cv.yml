name: Update CV from Google Scholar

# Scheduled workflows only fire from the default branch — this is inert until merged.
# Runs roughly every 10 days (Google Scholar has no official API; scraping less
# frequently keeps this well within reasonable/polite bounds). Use "Run workflow"
# in the Actions tab to trigger it on demand (e.g. right after a new paper is out).
on:
  schedule:
    - cron: '0 7 1,11,21 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-cv
  cancel-in-progress: false

jobs:
  update-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scholarly
        run: pip install -r scripts/requirements.txt

      - name: Refresh citation stats + publication list from Google Scholar
        run: python scripts/update_cv.py

      # The CV uses fontspec (XeLaTeX) with pgfplots, FontAwesome and Source Sans Pro —
      # this exact package set was verified locally to compile resume/cv.tex cleanly.
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-xetex \
            texlive-pictures texlive-science

      - name: Register the CV's bundled fonts (Roboto, FontAwesome) for fontspec
        run: |
          mkdir -p ~/.fonts
          cp resume/fonts/*.ttf ~/.fonts/
          fc-cache -f

      - name: Compile CV to PDF (two passes for cross-references)
        working-directory: resume
        run: |
          xelatex -interaction=nonstopmode cv.tex
          xelatex -interaction=nonstopmode cv.tex

      - name: Publish compiled PDF into data/
        run: |
          mkdir -p data
          mv resume/cv.pdf data/AadeshSalecha-CV.pdf

      - name: Commit if changed
        run: |
          git config user.name "cv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add resume/cv/publications_harvard.tex data/AadeshSalecha-CV.pdf
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Auto-update CV from Google Scholar"
          git push
